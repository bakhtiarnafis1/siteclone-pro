services:
  - type: web
    name: siteclone-pro-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # Render Free = 512 MB RAM / 0.1 CPU. These match the Dockerfile defaults.
    envVars:
      # Supabase (database, sign-in, ZIP storage). Values: Supabase dashboard → Project Settings → API.
      # Set them in the Render dashboard (never commit the service-role key).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_JOBS_PER_IP
        value: "2"
      - key: MAX_QUEUE_LENGTH
        value: "15"
      - key: MAX_PAGES
        value: "100"
      - key: CRAWL_BUDGET_MAX_MIN
        value: "25"
      - key: CHROMIUM_HEAP_MB
        value: "192"
      - key: CHROMIUM_RENDERER_LIMIT
        value: "2"
      - key: RETENTION_HOURS
        value: "24"
      - key: ASSET_FETCH_CONCURRENCY
        value: "4"
      - key: MAX_ASSET_MB
        value: "40"
      - key: INBROWSER_MAX_ASSET_MB
        value: "3"
