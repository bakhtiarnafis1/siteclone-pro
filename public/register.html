<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232f5bff%27/%3E%3Crect x=%279%27 y=%2711%27 width=%2711%27 height=%2712%27 rx=%272%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.2%27/%3E%3Cpath d=%27M13 9h8a2 2 0 0 1 2 2v9%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.2%27/%3E%3C/svg%3E" />
  <title>Create an account — SiteClone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="min-h-screen font-sans text-white">
  <div class="hero-glow pointer-events-none fixed inset-x-0 top-0 -z-10 h-[520px]"></div>

  <header class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
    <a href="/" class="flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-accent shadow-[0_0_18px_rgba(47,91,255,0.55)]">
        <i data-lucide="copy" class="h-4 w-4 text-white"></i>
      </span>
      <span class="text-sm font-semibold tracking-tight">SiteClone</span>
    </a>
    <a href="/login" class="text-sm text-body hover:text-white">Log in</a>
  </header>

  <main class="mx-auto flex max-w-md flex-col px-5 pb-20 pt-10">
    <h1 class="text-3xl font-semibold tracking-tight">Create an account</h1>
    <p class="mt-2 text-sm text-body">Create your account to download whole websites and the pages behind your own logins.</p>

    <form id="register-form" class="clone-card mt-8 space-y-5 rounded-2xl p-6" novalidate>
      <div>
        <label for="name" class="mb-1.5 block text-sm font-medium">Full name</label>
        <input id="name" type="text" autocomplete="name" required placeholder="Your name" class="field" />
      </div>
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" class="field" />
      </div>
      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium">Password</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="8" class="field" />
        <p class="mt-1.5 text-xs text-dim">At least 8 characters.</p>
      </div>
      <label class="flex items-start gap-2.5 text-sm text-body">
        <input id="agree" type="checkbox" class="mt-0.5 h-4 w-4" />
        <span>I agree to the Terms of Service and Privacy Policy, and I will only download websites I own or am allowed to copy.</span>
      </label>

      <p id="form-error" class="hidden rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-300" role="alert"></p>

      <button id="submit-btn" type="submit" class="btn-primary flex h-11 w-full items-center justify-center gap-2 rounded-xl text-sm font-semibold">
        <span id="submit-text">Create account</span>
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-body">
      Already have an account? <a href="/login" class="font-medium text-accent-soft hover:text-white">Log in</a>
    </p>
  </main>

  <script src="/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    lucide.createIcons();
    if (SC.session.isLoggedIn()) location.replace('/app');

    const form = document.getElementById('register-form');
    const errEl = document.getElementById('form-error');
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('submit-text');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const agree = document.getElementById('agree').checked;
      if (!name) return showError('Please enter your name.');
      if (!email) return showError('Please enter your email.');
      if (password.length < 8) return showError('Use at least 8 characters for your password.');
      if (!agree) return showError('Please accept the Terms and Privacy Policy.');

      btn.disabled = true;
      btnText.textContent = 'Creating account…';
      try {
        const data = await SC.api('/api/auth/register', { method: 'POST', body: { name, email, password, agree }, auth: false });
        SC.session.save(data.token, data.user);
        location.replace('/app');
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btnText.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
