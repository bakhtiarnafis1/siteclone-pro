<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2301a3a4%27/%3E%3Cpath d=%27M16 8v11m0 0-4.5-4.5M16 19l4.5-4.5M10 23h12%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E" />
  <title>Create an account — SiteClone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body class="min-h-screen font-sans">
  <div class="hero-bg fixed inset-0 -z-10"></div>
  <div class="grid-lines pointer-events-none fixed inset-x-0 top-0 -z-10 h-[520px]"></div>

  <header class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
    <a href="/" class="flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 shadow-brand"><i data-lucide="arrow-down-to-line" class="h-4 w-4 text-white"></i></span>
      <span class="font-display text-[15px] font-semibold tracking-tight">SiteClone</span>
    </a>
    <a href="/login" class="text-sm font-medium text-slate-600 hover:text-slate-950">Log in</a>
  </header>

  <main class="mx-auto flex max-w-[440px] flex-col px-5 pb-20 pt-10 sm:pt-14">
    <h1 class="text-center text-3xl font-bold">Create your account</h1>
    <p class="mt-2 text-center text-[15px] text-slate-600">Free. Download whole websites and the pages behind your own logins.</p>

    <form id="register-form" class="s-card mt-8 space-y-5 p-6 sm:p-7" novalidate>
      <div>
        <label for="name" class="mb-1.5 block text-sm font-semibold text-slate-800">Full name</label>
        <input id="name" type="text" autocomplete="name" required placeholder="Your name" class="s-field" />
      </div>
      <div>
        <label for="email" class="mb-1.5 block text-sm font-semibold text-slate-800">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" class="s-field" />
      </div>
      <div>
        <label for="password" class="mb-1.5 block text-sm font-semibold text-slate-800">Password</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="8" class="s-field" />
        <p class="mt-1.5 text-xs text-slate-500">At least 8 characters.</p>
      </div>
      <label class="flex items-start gap-2.5 text-sm text-slate-600">
        <input id="agree" type="checkbox" class="mt-0.5 h-4 w-4" />
        <span>I agree to the Terms of Service and Privacy Policy, and I will only download websites I own or am allowed to copy.</span>
      </label>

      <p id="form-error" class="hidden rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700" role="alert"></p>

      <button id="submit-btn" type="submit" class="s-btn s-btn-primary h-11 w-full text-sm">
        <span id="submit-text">Create account</span>
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      Already have an account? <a href="/login" class="font-semibold text-brand-700 hover:text-brand-900">Log in</a>
    </p>
  </main>

  <script src="/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    lucide.createIcons();
    if (SC.session.isLoggedIn()) location.replace('/app');

    const form = document.getElementById('register-form');
    const errEl = document.getElementById('form-error');
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('submit-text');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const agree = document.getElementById('agree').checked;
      if (!name) return showError('Please enter your name.');
      if (!email) return showError('Please enter your email.');
      if (password.length < 8) return showError('Use at least 8 characters for your password.');
      if (!agree) return showError('Please accept the Terms and Privacy Policy.');

      btn.disabled = true;
      btnText.textContent = 'Creating account…';
      try {
        await SC.api('/api/auth/register', { method: 'POST', body: { name, email, password, agree }, auth: false });
        btnText.textContent = 'Signing you in…';
        await SC.session.signIn(email, password);
        const me = await SC.api('/api/auth/me?login=1');
        SC.session.saveUser(me.user);
        location.replace('/app');
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btnText.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
