<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2301a3a4%27/%3E%3Cpath d=%27M16 8v11m0 0-4.5-4.5M16 19l4.5-4.5M10 23h12%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E" />
  <title>Log in — SiteClone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body class="min-h-screen font-sans">
  <div class="hero-bg fixed inset-0 -z-10"></div>
  <div class="grid-lines pointer-events-none fixed inset-x-0 top-0 -z-10 h-[520px]"></div>

  <header class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
    <a href="/" class="flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 shadow-brand"><i data-lucide="arrow-down-to-line" class="h-4 w-4 text-white"></i></span>
      <span class="font-display text-[15px] font-semibold tracking-tight">SiteClone</span>
    </a>
    <a href="/register" class="text-sm font-medium text-slate-600 hover:text-slate-950">Create an account</a>
  </header>

  <main class="mx-auto flex max-w-[420px] flex-col px-5 pb-20 pt-10 sm:pt-16">
    <h1 class="text-center text-3xl font-bold">Welcome back</h1>
    <p class="mt-2 text-center text-[15px] text-slate-600">Log in to download websites and see your history.</p>

    <form id="login-form" class="s-card mt-8 space-y-5 p-6 sm:p-7" novalidate>
      <div>
        <label for="email" class="mb-1.5 block text-sm font-semibold text-slate-800">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" class="s-field" />
      </div>
      <div>
        <div class="mb-1.5 flex items-center justify-between">
          <label for="password" class="text-sm font-semibold text-slate-800">Password</label>
          <span class="text-xs text-slate-500" title="Ask the site admin to set a temporary password for you.">Forgot it? Ask the admin</span>
        </div>
        <div class="relative">
          <input id="password" type="password" autocomplete="current-password" required class="s-field pr-11" />
          <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-slate-700" aria-label="Show password">
            <i data-lucide="eye" class="h-4 w-4"></i>
          </button>
        </div>
      </div>

      <p id="form-error" class="hidden rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700" role="alert"></p>

      <button id="submit-btn" type="submit" class="s-btn s-btn-primary h-11 w-full text-sm">
        <span id="submit-text">Log in</span>
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      Don't have an account? <a href="/register" class="font-semibold text-brand-700 hover:text-brand-900">Create one free</a>
    </p>
    <p class="mt-8 flex items-center justify-center gap-1.5 text-xs text-slate-500"><i data-lucide="shield-check" class="h-3.5 w-3.5"></i>Secured by Supabase Auth</p>
  </main>

  <script src="/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    lucide.createIcons();
    const params = new URLSearchParams(location.search);
    const next = (() => {
      const n = params.get('next') || '/app';
      return n.startsWith('/') && !n.startsWith('//') ? n : '/app';
    })();
    if (SC.session.isLoggedIn()) location.replace(next);

    const form = document.getElementById('login-form');
    const errEl = document.getElementById('form-error');
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('submit-text');
    const pw = document.getElementById('password');

    document.getElementById('toggle-pw').addEventListener('click', () => {
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      const email = document.getElementById('email').value.trim().toLowerCase();
      if (!email || !pw.value) return showError('Enter your email and password.');
      btn.disabled = true;
      btnText.textContent = 'Logging in…';
      try {
        await SC.session.signIn(email, pw.value);
        // records the login and checks the account is active
        const me = await SC.api('/api/auth/me?login=1', { redirectOn401: false });
        SC.session.saveUser(me.user);
        location.replace(next);
      } catch (err) {
        if (err.status === 401) {
          await SC.session.signOut();
          showError('This account cannot sign in. Contact support.');
        } else {
          showError(err.message);
        }
        btn.disabled = false;
        btnText.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
