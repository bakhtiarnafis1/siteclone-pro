<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232f5bff%27/%3E%3Crect x=%279%27 y=%2711%27 width=%2711%27 height=%2712%27 rx=%272%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.2%27/%3E%3Cpath d=%27M13 9h8a2 2 0 0 1 2 2v9%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.2%27/%3E%3C/svg%3E" />
  <title>Log in — SiteClone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="min-h-screen font-sans text-white">
  <div class="hero-glow pointer-events-none fixed inset-x-0 top-0 -z-10 h-[520px]"></div>

  <header class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
    <a href="/" class="flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-accent shadow-[0_0_18px_rgba(47,91,255,0.55)]">
        <i data-lucide="copy" class="h-4 w-4 text-white"></i>
      </span>
      <span class="text-sm font-semibold tracking-tight">SiteClone</span>
    </a>
    <a href="/register" class="text-sm text-body hover:text-white">Create an account</a>
  </header>

  <main class="mx-auto flex max-w-md flex-col px-5 pb-20 pt-10">
    <h1 class="text-3xl font-semibold tracking-tight">Log in</h1>
    <p class="mt-2 text-sm text-body">Welcome back. Log in to download websites and see your history.</p>

    <form id="login-form" class="clone-card mt-8 space-y-5 rounded-2xl p-6" novalidate>
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" class="field" />
      </div>
      <div>
        <div class="mb-1.5 flex items-center justify-between">
          <label for="password" class="text-sm font-medium">Password</label>
          <span class="text-xs text-dim" title="Ask the site admin to set a temporary password for you.">Forgot it? Ask the admin</span>
        </div>
        <div class="relative">
          <input id="password" type="password" autocomplete="current-password" required class="field pr-11" />
          <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-dim hover:text-white" aria-label="Show password">
            <i data-lucide="eye" class="h-4 w-4"></i>
          </button>
        </div>
      </div>

      <p id="form-error" class="hidden rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-300" role="alert"></p>

      <button id="submit-btn" type="submit" class="btn-primary flex h-11 w-full items-center justify-center gap-2 rounded-xl text-sm font-semibold">
        <span id="submit-text">Log in</span>
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-body">
      Don't have an account? <a href="/register" class="font-medium text-accent-soft hover:text-white">Create an account</a>
    </p>
  </main>

  <script src="/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    lucide.createIcons();
    const params = new URLSearchParams(location.search);
    const next = (() => {
      const n = params.get('next') || '/app';
      return n.startsWith('/') && !n.startsWith('//') ? n : '/app';
    })();
    if (SC.session.isLoggedIn()) location.replace(next);

    const form = document.getElementById('login-form');
    const errEl = document.getElementById('form-error');
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('submit-text');
    const pw = document.getElementById('password');

    document.getElementById('toggle-pw').addEventListener('click', () => {
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      const email = document.getElementById('email').value.trim();
      if (!email || !pw.value) {
        errEl.textContent = 'Enter your email and password.';
        errEl.classList.remove('hidden');
        return;
      }
      btn.disabled = true;
      btnText.textContent = 'Logging in…';
      try {
        const data = await SC.api('/api/auth/login', { method: 'POST', body: { email, password: pw.value }, auth: false });
        SC.session.save(data.token, data.user);
        location.replace(next);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
